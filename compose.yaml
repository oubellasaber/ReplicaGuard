services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: replicaguard
      POSTGRES_USER: replicaguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replicaguard -d replicaguard"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  trawl:
    image: ghcr.io/germondai/trawl:latest
    container_name: trawl
    environment:
      - BROWSER_POOL_SIZE=1
    ports:
      - "8191:8191"
    shm_size: "1gb"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/ReplicaGuard.Api/Dockerfile
    ports:
      - "8081:8080"
    env_file: .env
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=replicaguard;Username=replicaguard;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Encryption__Base64Key: ${ENCRYPTION_KEY}
      Jwt__Issuer: "ReplicaGuard"
      Jwt__Audience: "ReplicaGuard.Api"
      Spool__SpoolDirectory: "/app/spool"
      UserUploads__UploadDirectory: "/app/uploads"
    volumes:
      - spool:/app/spool
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      trawl:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  spool:
  uploads:  
    